<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Record Expense - TenoPilot</title>
<!-- Tailwind CSS CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Playfair Display for headings -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="family">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'sahara-primary': '#c2652a',
            'sahara-surface': '#fcf9f8',
            'sahara-surface-dim': '#f6f3f2',
            'sahara-text': '#2d2621',
          },
          fontFamily: {
            'playfair': ['"Playfair Display"', 'serif'],
            'sans': ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'sahara': '8px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-typography">
    h1, h2, h3 {
      font-family: 'Playfair Display', serif;
    }
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
<style data-purpose="modal-backdrop">
    .modal-overlay {
      background-color: rgba(45, 38, 33, 0.4);
      backdrop-filter: blur(4px);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #dcd9d9;
      border-radius: 10px;
    }
  </style>
</head>
<body class="bg-sahara-surface text-sahara-text h-screen overflow-hidden">
<!-- BEGIN: DashboardBackground -->
<!-- This represents the TenoPilot dashboard visible behind the modal -->
<div aria-hidden="true" class="flex h-full w-full opacity-50 pointer-events-none">
<!-- Sidebar -->
<aside class="w-64 border-r border-gray-200 bg-white p-6 flex flex-col gap-8">
<div class="text-xl font-bold tracking-tight text-sahara-primary">TenoPilot.com</div>
<nav class="flex flex-col gap-4">
<div class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Main</div>
<ul class="space-y-2">
<li class="p-2 rounded hover:bg-gray-100 flex items-center gap-3"><span class="w-5 h-5 bg-gray-200 rounded"></span> Dashboard</li>
<li class="p-2 rounded hover:bg-gray-100 flex items-center gap-3"><span class="w-5 h-5 bg-gray-200 rounded"></span> Floor Map</li>
<li class="p-2 rounded hover:bg-gray-100 flex items-center gap-3"><span class="w-5 h-5 bg-gray-200 rounded"></span> Tenants</li>
<li class="p-2 rounded bg-sahara-surface-dim font-medium flex items-center gap-3 text-sahara-primary"><span class="w-5 h-5 bg-sahara-primary rounded-sm"></span> Financial Hub</li>
<li class="p-2 rounded hover:bg-gray-100 flex items-center gap-3"><span class="w-5 h-5 bg-gray-200 rounded"></span> Staff Management</li>
<li class="p-2 rounded hover:bg-gray-100 flex items-center gap-3"><span class="w-5 h-5 bg-gray-200 rounded"></span> Maintenance</li>
</ul>
</nav>
</aside>
<!-- Main Content Area Placeholder -->
<main class="flex-1 p-10 bg-sahara-surface-dim">
<div class="max-w-5xl mx-auto">
<header class="flex justify-between items-center mb-8">
<h1 class="text-3xl">Financial Hub</h1>
<button class="bg-sahara-primary text-white px-4 py-2 rounded-sahara">Record Expense</button>
</header>
<div class="grid grid-cols-3 gap-6">
<div class="h-32 bg-white rounded-sahara border border-gray-100 shadow-sm"></div>
<div class="h-32 bg-white rounded-sahara border border-gray-100 shadow-sm"></div>
<div class="h-32 bg-white rounded-sahara border border-gray-100 shadow-sm"></div>
</div>
</div>
</main>
</div>
<!-- END: DashboardBackground -->
<!-- BEGIN: ModalOverlay -->
<div class="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
<!-- BEGIN: RecordExpenseModal -->
<div class="bg-white w-full max-w-lg rounded-sahara shadow-2xl overflow-hidden relative flex flex-col max-h-[90vh]" data-purpose="record-expense-modal">
<!-- Close Button -->
<button aria-label="Close modal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- Modal Content Wrapper -->
<div class="p-8 overflow-y-auto custom-scrollbar">
<header class="mb-6">
<h2 class="text-2xl font-bold text-sahara-text">Record Expense</h2>
<p class="text-gray-500 text-sm mt-1">Log a new expense in a few seconds.</p>
</header>
<!-- BEGIN: ExpenseForm -->
<form class="space-y-5">
<!-- Amount Input -->
<div>
<label class="block text-sm font-semibold text-sahara-text mb-1.5" for="amount">
              Amount <span class="text-red-500">*</span>
</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500 pointer-events-none">₹</span>
<input class="block w-full pl-8 pr-3 py-2.5 border border-gray-200 rounded-sahara focus:ring-sahara-primary focus:border-sahara-primary transition-all" id="amount" placeholder="Enter amount" type="number">
</div>
</div>
<!-- Category Select -->
<div>
<label class="block text-sm font-semibold text-sahara-text mb-1.5" for="category">
              Category <span class="text-red-500">*</span>
</label>
<select class="block w-full px-3 py-2.5 border border-gray-200 rounded-sahara focus:ring-sahara-primary focus:border-sahara-primary text-gray-600" id="category">
<option disabled="" selected="" value="">Select category...</option>
<option value="electricity">Electricity</option>
<option value="water">Water</option>
<option value="staff">Staff Salary</option>
<option value="maintenance">Maintenance</option>
</select>
<button class="mt-2 text-xs font-semibold text-sahara-primary hover:underline flex items-center gap-1" type="button">
<span class="text-lg leading-none">+</span> Add New Category
            </button>
</div>
<!-- Paid From Select -->
<div>
<label class="block text-sm font-semibold text-sahara-text mb-1.5" for="paid_from">Paid By *</label>
<select class="block w-full px-3 py-2.5 border border-gray-200 rounded-sahara focus:ring-sahara-primary focus:border-sahara-primary text-gray-600" id="paid_from">
<option disabled="" selected="" value="">Select payer...</option>
<option value="business">Business Account</option>
<option value="cash">Cash</option>
<option value="personal">Personal</option>
</select>
</div>
<!-- Receipt Upload -->
<div>
<label class="block text-sm font-semibold text-sahara-text mb-1.5">
              Receipt (Optional)
            </label>
<div class="border-2 border-dashed border-gray-200 rounded-sahara p-6 flex flex-col items-center justify-center bg-gray-50 hover:bg-sahara-surface-dim transition-colors cursor-pointer group" data-purpose="upload-zone">
<svg class="h-8 w-8 text-gray-400 group-hover:text-sahara-primary mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-sm font-medium text-sahara-text">Upload Receipt</span>
<span class="text-xs text-gray-400 mt-1">JPG, PNG, PDF (Max 5MB)</span>
<input class="hidden" type="file">
</div>
</div>
<!-- Notes Textarea -->
<div>
<label class="block text-sm font-semibold text-sahara-text mb-1.5" for="notes">
              Notes (Optional)
            </label>
<div class="relative">
<textarea class="block w-full px-3 py-2.5 border border-gray-200 rounded-sahara focus:ring-sahara-primary focus:border-sahara-primary text-sm transition-all resize-none" id="notes" maxlength="200" placeholder="Add a short note (if any)..." rows="3"></textarea>
<span class="absolute bottom-2 right-2 text-[10px] text-gray-400">0/200</span>
</div>
</div>
<!-- Form Actions -->
<div class="flex gap-3 pt-2">
<button class="flex-1 py-2.5 border border-gray-200 text-sahara-primary font-semibold rounded-sahara hover:bg-gray-50 transition-colors" type="button">
              Cancel
            </button>
<button class="flex-1 py-2.5 bg-sahara-primary text-white font-semibold rounded-sahara hover:bg-[#a65624] shadow-md transition-colors" type="submit">
              Save Expense
            </button>
</div>
</form>
<!-- END: ExpenseForm -->
</div>
<!-- BEGIN: SuccessToast -->
<div class="m-6 p-4 bg-[#f0f9f4] border border-[#c6e7d7] rounded-sahara flex items-center justify-between shadow-sm" data-purpose="success-toast">
<div class="flex items-center gap-3">
<!-- Green Check Icon -->
<div class="w-8 h-8 rounded-full bg-white border border-[#c6e7d7] flex items-center justify-center shrink-0">
<svg class="h-5 w-5 text-green-600" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" fill-rule="evenodd"></path>
</svg>
</div>
<div class="flex flex-col">
<span class="text-sm font-bold text-gray-800">Expense saved successfully!</span>
<span class="text-xs text-gray-600">₹12,400 - Electricity</span>
</div>
</div>
<button class="text-gray-400 hover:text-gray-600">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<!-- END: SuccessToast -->
</div>
<!-- END: RecordExpenseModal -->
</div>
<!-- END: ModalOverlay -->


</body></html>
