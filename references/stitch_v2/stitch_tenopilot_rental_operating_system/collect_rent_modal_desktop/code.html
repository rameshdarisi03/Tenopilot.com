<body class="bg-surface text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed">
<!-- Background Layer (Simulated Tenant Directory SCREEN_7) -->
<div class="fixed inset-0 z-0 overflow-hidden opacity-40 blur-sm pointer-events-none">
<!-- Sidebar Anchor -->
<div class="w-64 h-full bg-surface border-r border-outline-variant py-xl px-md flex flex-col">

<div class="space-y-sm">
<div class="p-md rounded-lg bg-surface-container-low border-r-4 border-primary text-primary font-bold">Tenants</div>
<div class="p-md text-on-surface-variant">Properties</div>
<div class="p-md text-on-surface-variant">Finance</div>
</div>
</div>
<!-- Main Content Anchor -->
<main class="flex-1 ml-64 p-xl">
<header class="flex justify-between items-center mb-xl">
<h1 class="font-headline-md text-headline-md">Tenant Directory</h1>
</header>
<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- Mock Tenant Cards -->
<div class="p-lg bg-white border border-border-sand rounded-xl h-48"></div>
<div class="p-lg bg-white border border-border-sand rounded-xl h-48"></div>
<div class="p-lg bg-white border border-border-sand rounded-xl h-48"></div>
</div>
</main>
</div>
<!-- Modal Overlay Backdrop -->
<div class="fixed inset-0 z-[60] bg-on-surface/20 backdrop-blur-sm flex items-center justify-center p-md">
<!-- Collect Rent Modal -->
<div class="w-full max-w-[560px] bg-surface-container-lowest rounded-xl shadow-2xl border border-outline-variant overflow-hidden animate-in fade-in zoom-in duration-300">
<!-- Modal Header -->
<div class="bg-surface-container-low px-lg py-xl border-b border-outline-variant">
<div class="flex justify-between items-start">
<div>
<h2 class="font-headline-md text-headline-md text-primary mb-xs">Collect Rent</h2>
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Sahara Management Hub</p>
</div>
<button class="p-sm text-on-surface-variant hover:bg-surface-container-highest rounded-full transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Tenant Profile Context -->
<div class="mt-xl flex items-center gap-md p-md bg-white rounded-lg border border-border-sand shadow-sm">
<div class="w-14 h-14 rounded-full bg-primary-fixed flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a sophisticated woman named Eleanor Vance in her late thirties with a friendly and warm expression. She has styled hair and is wearing a cream-colored silk blouse against a soft-focus background of a sunlit living room. The lighting is editorial and soft, matching a premium high-end real estate brand aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC88kOrE_HhGuV1rhX7z_Pc8FkLsnQXHLDho1JUy_eqKCS2MQnG044eylD2Jl9T7A8Md72qefx470OWZ4ngX45u2p2VbesdBlGXK6edLixYFWWuVOE07zs9k2JGnB7UNumFgk5o0Nizco3incg2RuVrE0LhGrVT5koSmkryrP1EWv88lhC9oW6uBnTEysCL8LX3SpdXV62nbwvBnNB2NjnooqVfgVLdkoQSr9yUVz4unq-u_5MjAG8HAQ">
</div>
<div>
<div class="font-title-lg text-title-lg text-on-surface">Eleanor Vance</div>
<div class="flex items-center gap-xs font-body-md text-body-md text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">domain</span>
                            Maple Terrace, Unit 4B
                        </div>
</div>
<div class="ml-auto text-right">
<div class="font-label-md text-label-md text-primary-container font-bold mb-xs">STATUS</div>
<div class="px-sm py-xs bg-error-container text-on-error-container rounded font-bold text-[10px] uppercase">Overdue</div>
</div>
</div>
</div>
<!-- Modal Content (Form) -->
<div class="p-lg space-y-xl">
<!-- Rent Amount & Date Row -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm">RENT AMOUNT</label>
<div class="relative group">
<span class="absolute left-md top-1/2 -translate-y-1/2 text-on-surface font-semibold">$</span>
<input class="w-full pl-8 pr-md py-md bg-surface-container-low border-transparent border-b-2 border-b-border-sand focus:border-primary focus:ring-0 text-on-surface font-headline-md rounded-t-lg transition-all" readonly="" type="text" value="2,450.00">
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm">PAYMENT DATE</label>
<div class="relative">
<input class="w-full px-md py-md bg-surface-container-low border-transparent border-b-2 border-b-border-sand focus:border-primary focus:ring-0 text-body-lg font-bold rounded-t-lg h-[52px]" type="date" value="2023-10-27">
</div>
</div>
</div>
<!-- Payment Mode Selection -->
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm">PAYMENT MODE</label>
<div class="grid grid-cols-3 gap-sm">
<button class="flex flex-col items-center justify-center gap-xs p-md border-2 border-primary bg-surface-container-low text-primary rounded-xl font-bold transition-all scale-[0.98]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md">CASH</span>
</button>
<button class="flex flex-col items-center justify-center gap-xs p-md border-2 border-border-sand hover:border-primary-fixed text-on-surface-variant hover:bg-surface-container-low rounded-xl transition-all">
<span class="material-symbols-outlined">qr_code_2</span>
<span class="font-label-md text-body-md">UPI</span>
</button>
<button class="flex flex-col items-center justify-center gap-xs p-md border-2 border-border-sand hover:border-primary-fixed text-on-surface-variant hover:bg-surface-container-low rounded-xl transition-all">
<span class="material-symbols-outlined">credit_card</span>
<span class="font-label-md">CARD</span>
</button>
</div>
</div>
<!-- Transaction Details -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-sm">TRANSACTION ID / REFERENCE (OPTIONAL)</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline-variant">receipt_long</span>
<input class="w-full pl-12 pr-md py-md bg-surface-container-low border border-border-sand focus:border-primary focus:ring-0 rounded-lg text-body-md transition-all" placeholder="Enter TXN or receipt number" type="text">
</div>
</div>
<!-- Notification Checkbox -->
<div class="flex items-center gap-md p-md bg-surface-container-low rounded-lg border border-dashed border-border-sand">
<input checked="" class="w-5 h-5 rounded text-primary border-border-sand focus:ring-primary-container" type="checkbox">
<p class="font-body-md text-body-md text-on-surface-variant">Send digital receipt to Eleanor Vance automatically.</p>
</div>
</div>
<!-- Modal Footer -->
<div class="p-lg bg-surface-container-low flex items-center justify-end gap-md">
<button class="px-lg py-md text-on-surface-variant font-bold hover:text-primary transition-colors">
                    Cancel
                </button>
<button class="px-xl py-md bg-primary text-white font-bold rounded-lg shadow-lg hover:shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center gap-sm">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
                    Record Payment
                </button>
</div>
</div>
</div>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                if (this.innerText.includes('CASH') || this.innerText.includes('UPI') || this.innerText.includes('CARD')) {
                    document.querySelectorAll('.grid-cols-3 button').forEach(b => {
                        b.classList.remove('border-primary', 'bg-surface-container-low', 'text-primary', 'scale-[0.98]');
                        b.classList.add('border-border-sand', 'text-on-surface-variant');
                        b.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
                    });
                    this.classList.add('border-primary', 'bg-surface-container-low', 'text-primary', 'scale-[0.98]');
                    this.classList.remove('border-border-sand', 'text-on-surface-variant');
                    this.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                }
            });
        });
        
        // Auto-set today's date
        const today = new Date().toISOString().split('T')[0];
        document.querySelector('input[type="date"]').value = today;
    </script>
</body></html>
